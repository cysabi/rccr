<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Recurse Center Conference Room</title>
    <link rel="icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main class="content">
      <header class="header">
        <div class="brand">
          <span class="logo-box"><img class="logo" src="icons/rc.svg" alt="" /></span>
          <div class="brand-text">
            <span class="eyebrow">Recurse Center</span>
            <h1 class="title">Conference Room</h1>
          </div>
        </div>
        <div class="clock">
          <time class="clock-time" id="time"></time>
          <span class="clock-date" id="date"></span>
        </div>
      </header>

      <section class="section rooms" aria-labelledby="rooms-label">
        <h2 class="section-title" id="rooms-label">
          <svg class="section-icon"><use href="#icon-video" /></svg>
          Meeting Rooms
        </h2>
        <ul class="room-grid" id="rooms"></ul>
      </section>

      <section class="section lounge" aria-labelledby="lounge-label">
        <h2 class="section-title" id="lounge-label">
          <svg class="section-icon"><use href="#icon-users" /></svg>
          Lounge &amp; Pairing
        </h2>
        <ul class="room-grid" id="lounge"></ul>
      </section>

      <aside class="section schedule" aria-labelledby="schedule-label">
        <h2 class="section-title" id="schedule-label">
          <svg class="section-icon"><use href="#icon-calendar" /></svg>
          Today's schedule
        </h2>
        <ol class="schedule-list" id="schedule"></ol>
        <p class="schedule-done" id="schedule-done" hidden></p>
      </aside>
    </main>

    <template id="room-template">
      <li>
        <a class="room" target="_blank" rel="noopener noreferrer">
          <span class="room-icon">
            <svg><use /></svg>
            <kbd class="room-key"><span class="room-key-cap"></span></kbd>
          </span>
          <span class="room-text">
            <span class="room-name"></span>
            <span class="room-meta">
              <span class="room-guests" hidden>
                <svg><use href="#icon-user" /></svg><span class="room-guests-count"></span>
              </span>
              <span class="faces"></span>
              <span class="room-status" hidden><span class="room-status-text"></span></span>
            </span>
          </span>
        </a>
      </li>
    </template>

    <template id="event-template">
      <li>
        <a class="event" target="_blank" rel="noopener noreferrer">
          <span class="event-time">
            <span class="event-start"></span>
            <span class="event-end"></span>
          </span>
          <span class="event-text">
            <span class="event-title"></span>
            <span class="event-meta">
              <span class="event-room">
                <svg><use /></svg><span class="event-room-name"></span><span class="event-when"></span>
              </span>
              <span class="faces"></span>
            </span>
          </span>
        </a>
      </li>
    </template>

    <svg class="sprite" aria-hidden="true">
      <!-- Lucide icons (ISC license) -->
      <symbol id="icon-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" />
        <rect x="2" y="6" width="14" height="12" rx="2" />
      </symbol>
      <symbol id="icon-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="14" x="2" y="3" rx="2" />
        <line x1="8" x2="16" y1="21" y2="21" />
        <line x1="12" x2="12" y1="17" y2="21" />
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </symbol>
      <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </symbol>
      <symbol id="icon-sofa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3" />
        <path d="M2 16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z" />
        <path d="M4 18v2" />
        <path d="M20 18v2" />
        <path d="M12 4v9" />
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2v4" />
        <path d="M16 2v4" />
        <rect width="18" height="18" x="3" y="4" rx="2" />
        <path d="M3 10h18" />
      </symbol>
    </svg>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
