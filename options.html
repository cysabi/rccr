<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>RCCR / Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>RCCR / Settings</h1>

      <form id="settings">
        <fieldset>
          <legend>room</legend>
          <p>name of the in-person room this is in</p>
          <input name="roomName" aria-label="room" placeholder="sammet" autocomplete="off" spellcheck="false" />
        </fieldset>

        <fieldset>
          <legend>virtual rc</legend>
          <p>
            create an app at
            <a href="https://recurse.rctogether.com/apps" target="_blank">recurse.rctogether.com/apps</a>.
          </p>
          <label>app id <input name="rctAppId" autocomplete="off" spellcheck="false" /></label>
          <label>app secret <input name="rctAppSecret" autocomplete="off" spellcheck="false" /></label>
        </fieldset>

        <fieldset>
          <legend>calendar</legend>
          <p>
            paste the ical link from
            <a href="https://www.recurse.com/calendar" target="_blank">recurse.com/calendar</a>, or
            just its token.
          </p>
          <label>
            calendar link or token
            <input name="calendarToken" autocomplete="off" spellcheck="false" />
          </label>
        </fieldset>

        <button type="submit">save</button>
        <output id="status"></output>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
